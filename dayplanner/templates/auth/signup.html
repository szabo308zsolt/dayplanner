{% extends "base.html" %}
{% block title %}Sign up · Day Planner{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="muted">Set up your working day once, then plan each morning in a minute.</p>
<form method="post" class="stack">
  {{ csrf() }}
  <label>Email <input type="email" name="email" required autocomplete="email" autofocus value="{{ request.form.email }}"></label>
  <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password">
    <small class="muted">At least 8 characters.</small></label>
  <button class="primary">Sign up</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
