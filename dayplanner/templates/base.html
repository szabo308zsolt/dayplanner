<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Day Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Day Planner</a>
    {% if g.user %}
    <nav>
      <a href="{{ url_for('planner.today') }}">Today</a>
      <a href="{{ url_for('settings.edit') }}">Settings</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        {{ csrf() }}<button class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
